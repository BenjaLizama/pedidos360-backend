spring:
  application:
    name: ms-rabbitmq-admin
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/realms/pedidos360/protocol/openid-connect/certs
server:
  port: 8085
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html