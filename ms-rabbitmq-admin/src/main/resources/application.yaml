spring:
  application:
    name: ms-rabbitmq-admin
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/realms/pedidos360}
          jwk-set-uri: ${JWT_SET_URI:http://localhost:8080/realms/pedidos360/protocol/openid-connect/certs}
security:
  jwt:
    roles-claim: ${JWT_ROLES_CLAIM:realm_access.roles}
    roles-prefix: ${JWT_ROLES_PREFIX:ROLE_}
server:
  port: 8085
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html