# management.load_definitions = /etc/rabbitmq/definitions.json

# Descubrimiento de nodos del cluster
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-master
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-slave

# Limpieza de nodos
cluster_formation.node_cleanup.interval = 10000

# Distribución de maestros de colas clásicas
queue_master_locator = min-masters