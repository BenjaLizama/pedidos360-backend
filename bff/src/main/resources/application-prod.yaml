# ==================================================
# SERVIDOR
# ==================================================
server:
  port: ${PORT:8083}

# ==================================================
# SEGURIDAD - KEYCLOAK
# ==================================================
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:${KEYCLOAK_ISSUER_URI}}
          jwk-set-uri: ${JWT_SET_URI}

# ==================================================
# AUTORIZACIÓN JWT
# ==================================================
security:
  jwt:
    roles-claim: ${JWT_ROLES_CLAIM:realm_access.roles}
    roles-prefix: ${JWT_ROLES_PREFIX:ROLE_}

# ==================================================
# CLIENTES HTTP - MICROSERVICIOS
# ==================================================
app:
  clients:
    catalog:
      base-url: ${CATALOG_SERVICE_URL}

    orders:
      base-url: ${ORDERS_SERVICE_URL}

  # ==================================================
  # CORS
  # ==================================================
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# ==================================================
# LOGGING
# ==================================================
logging:
  level:
    root: INFO
    cl.pedidos360.bff: INFO
    org.springframework.security: WARN