spring:
  application:
    name: ms-orders

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  threads:
    virtual:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_SET_URI:http://keycloak:8080/realms/pedidos360/protocol/openid-connect/certs}

  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual # Garantía de procesamiento crítico
        prefetch: 1 # Distribución equitativa de carga (Fair Dispatch)
        retry:
          enabled: true # Reintentos con Backoff antes de enviar a la DLQ
          initial-interval: 1000
          multiplier: 2.0
          max-attempts: 3

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  roles-claim: ${JWT_ROLES_CLAIM:realm_access.roles}
  roles-prefix: ${JWT_ROLES_PREFIX:ROLE_}

server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

  info:
    env:
      enabled: false

info:
  app:
    name: ${spring.application.name}
    description: Microservicio de gestión de órdenes de Pedidos360

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html